apiVersion: apps/v1
kind: Deployment
metadata: { name: maritimeint, labels: { app: maritimeint } }
spec:
  replicas: 1
  selector: { matchLabels: { app: maritimeint } }
  template:
    metadata: { labels: { app: maritimeint } }
    spec:
      containers:
        - name: maritimeint
          image: ghcr.io/cognis-digital/maritimeint:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: maritimeint }
spec:
  selector: { app: maritimeint }
  ports: [{ port: 80, targetPort: 8000 }]
